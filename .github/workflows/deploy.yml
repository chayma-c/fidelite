name: Deploy

# Only main -- this is the pipeline that actually ships to production.
# Re-runs the same checks as ci.yml (rather than trusting an earlier run)
# so the exact commit being deployed is what was actually verified, then
# builds+pushes the image, then deploys. Each stage only runs if the
# previous one succeeded.
on:
  push:
    branches: [main]

jobs:
  test-flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: fidelite_flutter
        run: flutter pub get
      - working-directory: fidelite_flutter
        run: flutter analyze
      - working-directory: fidelite_flutter
        run: flutter test

  test-server:
    name: Server analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - working-directory: fidelite_server
        run: dart pub get
      - working-directory: fidelite_server
        run: dart analyze

  build:
    name: Build + push image
    runs-on: ubuntu-latest
    needs: [test-flutter, test-server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: fidelite_server
          file: fidelite_server/Dockerfile
          push: true
          tags: |
            chayma096/fidelite:latest
            chayma096/fidelite:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/fidelite
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d
