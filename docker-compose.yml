name: fidelite

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # DB/user/volume are still named "keycloak" -- historical, from when
    # this container also ran Keycloak (removed; auth is now self-hosted in
    # the Serverpod backend, see SETUP.md). Renaming them would mean Docker
    # attaching a brand-new empty volume instead of the one that actually
    # holds the data, so they're kept as-is rather than "cleaned up".
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keycloak_db:
