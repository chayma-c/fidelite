# This is the configuration file for the production environment: a single
# Docker Compose stack on the OVH VPS (see docker-compose.prod.yml at the
# repo root and SETUP.md for the full deployment writeup). Traffic reaches
# this container through the *other* project's existing Caddy instance,
# which already owns host ports 80/443 for sansalearning.com -- Fidélité
# is a second, independent site block on that same Caddy, not its own
# reverse proxy.

# Configuration for the main API server -- the only one actually exposed
# to the internet (via Caddy). This is the one URL the Flutter app talks to.
apiServer:
  port: 8080
  publicHost: fidelite.sansalearning.com
  publicPort: 443
  publicScheme: https

# Insights and the web server are deliberately NOT proxied publicly --
# Insights exposes session/error logs, which shouldn't sit on the open
# internet without auth in front of it. Revisit if remote Insights access
# is ever actually needed (e.g. behind its own protected route).
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

# "db" is the docker-compose service name for Fidélité's own Postgres
# container, reachable only from the backend container on the isolated
# fidelite_internal network -- not the public internet, not the other
# app's Postgres. requireSsl is off because this traffic never leaves that
# internal Docker network; TLS here would be theater, not protection.
database:
  host: db
  port: 5432
  name: fidelite
  user: fidelite
  requireSsl: false
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

# This is the setup for Redis. The default for the Google Cloud Engine Terraform
# configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. redis.examplepod.com.
redis:
  enabled: false
  host: redis.private-production.examplepod.com
  port: 6379
  #user: # defaults to empty
  #requireSsl: true # defaults to false

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

sessionLogs:
  consoleEnabled: false
  persistentEnabled: true # queryable via psql/Insights -- see SETUP.md
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000
