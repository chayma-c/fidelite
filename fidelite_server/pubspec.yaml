name: fidelite_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

dependencies:
  serverpod: 3.4.13
  crypto: ^3.0.5 # hashing order-claim tokens (store hash only, never the raw token)
  http: ^1.2.2 # sending emails via the Resend API

  # Self-hosted auth: AuthUser/session/JWT issuance/Argon2 password hashing,
  # Scope-based authorization (drop-in for the Keycloak-role -> Scope mapping
  # every endpoint's `requiredScopes` already depends on).
  serverpod_auth_core_server: 3.4.13
  # Email/password identity provider: registration w/ email verification,
  # login, password reset.
  serverpod_auth_idp_server: 3.4.13

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.13
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\fidelite_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\fidelite_server\web\app
      posix: |
        cd ../fidelite_flutter
        flutter build web --base-href /app/ --wasm --output ../fidelite_server/web/app
