### Why a points ledger entry exists.
enum: PointsLedgerReason
serialized: byName
default: adjustment
values:
  ### Cashback earned by a customer claiming a confirmed order's receipt QR.
  - orderClaim
  ### Legacy -- no longer written. Used to mean cashback credited
  ### automatically the moment an online order was placed, before online
  ### orders required scanning the receipt QR too (see
  ### OnlineOrderEndpoint); kept so historical ledger rows with this
  ### reason still deserialize correctly.
  - onlineOrder
  ### Cashback spent redeeming a reward (staff-scanned wallet QR).
  - redemption
  ### Points spent paying for an online order directly, at placement time
  ### (not a catalog reward redemption). No cashback is earned on the same
  ### order when this is how it's paid for -- see OrderPaymentMethod.points.
  - onlineOrderPayment
  ### Manual correction. Nothing creates this yet -- reserved for a future
  ### admin action.
  - adjustment
